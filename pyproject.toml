[project]
name = "servicedesk-ledger"
version = "1.0.0"
description = "Painel de SLA e backlog de chamados, cobrança recorrente e laboratório de índices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdledger"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
# N818 exige sufixo "Error" no nome da exceção. O domínio deste projeto é
# escrito em português (decisão D01), onde a convenção é o prefixo "Erro".
ignore = ["N818"]

[tool.ruff.lint.flake8-bugbear]
# Depends e Query como valor padrão são o idioma do FastAPI para injeção e
# validação, não o defeito de argumento mutável que a regra B008 procura.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sdledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib permite que unidade/ e integracao/ tenham arquivos de mesmo nome:
# test_chamado.py existe nos dois, e é natural que exista.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "integracao: exige um PostgreSQL de verdade em contêiner",
]
