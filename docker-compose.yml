services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdledger}
      POSTGRES_USER: ${POSTGRES_USER:-sdledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-isto}
      LAB_POSTGRES_DB: ${LAB_POSTGRES_DB:-sdledger_lab}
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./docker/init-lab.sh:/docker-entrypoint-initdb.d/10-init-lab.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdledger} -d ${POSTGRES_DB:-sdledger}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini:ro

volumes:
  dados-postgres:
